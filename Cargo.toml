[workspace]
resolver = "2"
members = ["crates/core", "crates/app"]

[workspace.package]
edition = "2021"
version = "0.4.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/paymonr/lite-bar"

[workspace.dependencies]
lite-bar-core = { path = "crates/core" }
windows = "0.62.2"
windows-numerics = "0.3.1"
ferrisetw = "1.2.0"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"
toml_edit = "0.25.17"
serde_json = "1.0.154"
thiserror = "2.0.21"
sha2 = { version = "0.11.1", default-features = false }
